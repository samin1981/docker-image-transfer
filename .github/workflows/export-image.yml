name: Export Java 21 Docker Image

on:
  workflow_dispatch:

jobs:
  export-image:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Java 21 Image
        run: docker pull eclipse-temurin:21-jre-noble

      - name: Save Docker Image
        run: docker save -o java-21-jre.tar eclipse-temurin:21-jre-noble

      - name: Upload Java 21 Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Java-21-JRE-image
          path: java-21-jre.tar
          retention-days: 7
