
name: Export Docker Images

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Redis Image
        run: |
          docker pull --platform linux/amd64 redis:7.4

      - name: Save Redis Image
        run: |
          docker save -o redis.tar redis:7.4

      - name: Pull Kafka Image
        run: |
          docker pull --platform linux/amd64 apache/kafka:4.1.2

      - name: Save Kafka Image
        run: |
          docker save -o kafka.tar apache/kafka:4.1.2

      - name: Upload Redis Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-image
          path: redis.tar
          retention-days: 7

      - name: Upload Kafka Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kafka-image
          path: kafka.tar
          retention-days: 7
